name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest Unblocked Music source code
        run: |
          git clone --depth=1 --branch feat/adapt-xeapi https://github.com/ITManCHINA/server.git
          cd server
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          node .yarn/releases/yarn-3.8.7.cjs
          node .yarn/releases/yarn-3.8.7.cjs build
          git commit -am "build: update precompiled bundle with xeapi"
          git archive --format=zip HEAD -o ../UnblockNeteaseMusic.zip
          cd ..
          rm -f ./app/src/main/assets/UnblockNeteaseMusic.zip
          mv ./UnblockNeteaseMusic.zip ./app/src/main/assets/UnblockNeteaseMusic.zip
          rm -rf server

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{github.workspace}}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
